<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Argos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #1a1d2e;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo { font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .logo span { color: #38bdf8; }
    .subtitle { color: #64748b; font-size: 0.875rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { display: block; font-size: 0.8rem; color: #94a3b8;
            margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: .05em; }
    input {
      width: 100%; padding: 0.75rem 1rem;
      background: #0f1117; border: 1px solid #2d3148;
      border-radius: 8px; color: #e2e8f0; font-size: 0.95rem;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #38bdf8; }
    .btn {
      width: 100%; padding: 0.85rem;
      background: #38bdf8; color: #0f1117;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 0.5rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #0ea5e9; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 0.75rem; }

    /* ── Dashboard ── */
    #dashboard-page { display: none; }

    .topbar {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3148;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar .logo { font-size: 1.3rem; }
    .user-badge {
      display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem;
    }
    .role-tag {
      background: #0c2340; padding: 0.25rem 0.75rem;
      border-radius: 999px; font-size: 0.75rem; color: #38bdf8;
    }
    .btn-sm {
      padding: 0.4rem 1rem; font-size: 0.8rem;
      background: #2d3148; color: #94a3b8;
      border: none; border-radius: 6px; cursor: pointer;
    }
    .btn-sm:hover { background: #3d4168; color: #e2e8f0; }

    .main { padding: 2rem; max-width: 1100px; margin: 0 auto; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem; margin-bottom: 2rem;
    }
    .stat-card {
      background: #1a1d2e; border: 1px solid #2d3148;
      border-radius: 12px; padding: 1.25rem;
    }
    .stat-label { color: #64748b; font-size: 0.75rem;
                  text-transform: uppercase; letter-spacing: .05em; }
    .stat-value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
    .stat-value.green { color: #34d399; }
    .stat-value.red   { color: #f87171; }
    .stat-value.blue  { color: #38bdf8; }

    h2 { font-size: 1rem; color: #94a3b8;
         margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .05em; }

    table {
      width: 100%; border-collapse: collapse;
      background: #1a1d2e; border-radius: 12px; overflow: hidden;
      border: 1px solid #2d3148;
    }
    th {
      text-align: left; padding: 0.75rem 1rem;
      font-size: 0.75rem; color: #64748b;
      text-transform: uppercase; letter-spacing: .05em;
      border-bottom: 1px solid #2d3148;
    }
    td { padding: 0.75rem 1rem; font-size: 0.875rem;
         border-bottom: 1px solid #1e2235; }
    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block; padding: 0.2rem 0.6rem;
      border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    }
    .badge.online  { background: #064e3b; color: #34d399; }
    .badge.offline { background: #450a0a; color: #f87171; }
    .badge.success { background: #064e3b; color: #34d399; }
    .badge.error   { background: #450a0a; color: #f87171; }
    .badge.pending { background: #0c2340; color: #38bdf8; }
  </style>
</head>
<body>

<!-- ── Login page ─────────────────────────────────────────────────────────── -->
<div id="login-page">
  <div class="login-card">
    <div class="logo">Arg<span>os</span></div>
    <p class="subtitle">Security orchestration platform</p>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="admin" value="admin"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" value="admin"/>
    </div>
    <button class="btn" onclick="login()">Sign in</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- ── Dashboard page ────────────────────────────────────────────────────── -->
<div id="dashboard-page">
  <div class="topbar">
    <div class="logo">Arg<span>os</span></div>
    <div class="user-badge">
      <span id="topbar-user"></span>
      <span class="role-tag" id="topbar-role"></span>
      <button class="btn-sm" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total devices</div>
        <div class="stat-value blue" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Online</div>
        <div class="stat-value green" id="stat-online">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Offline</div>
        <div class="stat-value red" id="stat-offline">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Executions</div>
        <div class="stat-value blue" id="stat-exec">—</div>
      </div>
    </div>

    <h2>Devices</h2>
    <table style="margin-bottom:2rem">
      <thead>
        <tr>
          <th>Name</th><th>Tenant</th><th>IP</th>
          <th>Status</th><th>Last seen</th>
        </tr>
      </thead>
      <tbody id="devices-tbody">
        <tr><td colspan="5" style="color:#64748b">Loading...</td></tr>
      </tbody>
    </table>

    <h2>Recent executions</h2>
    <table>
      <thead>
        <tr>
          <th>Job ID</th><th>Task</th><th>Target</th>
          <th>Tenant</th><th>Status</th><th>Date</th>
        </tr>
      </thead>
      <tbody id="exec-tbody">
        <tr><td colspan="6" style="color:#64748b">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API = "http://localhost:8000";
  let token = null;

  async function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    document.getElementById("login-error").textContent = "";

    const form = new URLSearchParams();
    form.append("username", user);
    form.append("password", pass);

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form
      });
      if (!res.ok) throw new Error("Invalid credentials");
      const data = await res.json();
      token = data.access_token;

      document.getElementById("login-page").style.display    = "none";
      document.getElementById("dashboard-page").style.display = "block";
      document.getElementById("topbar-user").textContent = user;
      document.getElementById("topbar-role").textContent = data.role;

      await loadDashboard();
    } catch (e) {
      document.getElementById("login-error").textContent = e.message;
    }
  }

  async function loadDashboard() {
    const headers = { Authorization: `Bearer ${token}` };

    const devRes  = await fetch(`${API}/devices`,    { headers });
    const devices = await devRes.json();
    const online  = devices.filter(d => d.status === "online").length;

    document.getElementById("stat-total").textContent   = devices.length;
    document.getElementById("stat-online").textContent  = online;
    document.getElementById("stat-offline").textContent = devices.length - online;

    document.getElementById("devices-tbody").innerHTML = devices.map(d => `
      <tr>
        <td>${d.name}</td>
        <td>${d.tenant_id}</td>
        <td>${d.ip || "—"}</td>
        <td><span class="badge ${d.status}">${d.status}</span></td>
        <td>${d.last_seen ? new Date(d.last_seen).toLocaleString() : "—"}</td>
      </tr>
    `).join("") || '<tr><td colspan="5" style="color:#64748b">No devices</td></tr>';

    const execRes = await fetch(`${API}/executions`, { headers });
    const execs   = await execRes.json();

    document.getElementById("stat-exec").textContent = execs.length;
    document.getElementById("exec-tbody").innerHTML = execs.map(e => `
      <tr>
        <td style="font-family:monospace;font-size:0.8rem">${e.job_id}</td>
        <td>${e.task_type}</td>
        <td>${e.target || "—"}</td>
        <td>${e.tenant_id}</td>
        <td><span class="badge ${e.status}">${e.status}</span></td>
        <td>${new Date(e.created_at).toLocaleString()}</td>
      </tr>
    `).join("") || '<tr><td colspan="6" style="color:#64748b">No executions yet</td></tr>';
  }

  function logout() {
    token = null;
    document.getElementById("dashboard-page").style.display = "none";
    document.getElementById("login-page").style.display     = "flex";
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && !token) login();
  });
</script>
</body>
</html>
